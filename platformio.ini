; esp32s3-can-gateway — Waveshare ESP32-S3-CAN-2CH
;
; Build:   pio run
; Flash:   pio run -t upload --upload-port COMx
;          (or set the PLATFORMIO_UPLOAD_PORT environment variable)
; Monitor: pio device monitor --port COMx

[platformio]
default_envs = esp32s3

[env:esp32s3]
; espressif32 6.12.0 ships ESP-IDF 5.5
platform = espressif32@6.12.0
framework = espidf
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:tools/embed_web.py
